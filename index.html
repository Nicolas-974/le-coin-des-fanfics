<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Coin des Fanfics</title>
  </head>
  <body>
    <div id="panel-hint" title="Options disponibles ici">→</div>

    <div id="theme-panel" aria-expanded="false">
      <div id="theme-handle" title="Ouvrir le panneau">««</div>
      <div id="theme-content" role="region" aria-label="Panneau thème">
        <button id="theme-cycle" class="panel-icon" type="button" title="Changer de thème" aria-label="Changer de thème">🎨</button>
        <button id="lang-toggle" class="panel-icon" type="button" title="Changer de langue" aria-label="Changer de langue">🌐</button>
      </div>
    </div>

    <div id="toast"></div>

    <div class="page">
      <header class="site-header">
        <h1>Le Coin des Fanfics</h1>
        <p class="tagline" data-i18n="tagline"></p>
        <p class="credit-note" data-i18n="credit_note"></p>
      </header>

      <section id="catalog"></section>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
